<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f4e79">
<title>Müşteri Notları</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="search" id="searchBox">
      <div class="chips" id="chips"></div>
      <input id="searchInput" type="search" autocomplete="off" placeholder="Ara..." enterkeyhint="search">
      <button type="button" class="x-black x-clear" id="clearSearch" title="Aramayı temizle" aria-label="Aramayı temizle">&times;</button>
    </div>
    <button type="button" class="btn primary" id="addBtn">Not Ekle</button>
    <button type="button" class="btn" id="archiveBtn">Arşiv</button>
  </header>

  <div class="sortbar" role="radiogroup" aria-label="Sıralama">
    <span>Sıralama:</span>
    <label><input type="radio" name="sort" value="created" checked> Kayıt tarihine göre</label>
    <label><input type="radio" name="sort" value="person"> İlgili kişiye göre</label>
  </div>

  <main class="table-wrap" id="tableWrap">
    <table class="notes">
      <thead>
        <tr><th class="c-date">Tarih / Saat</th><th class="c-person">Kişiler</th><th class="c-notes">Notlar</th></tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
    <div class="empty" id="empty">Henüz not yok. “Not Ekle” ile başlayın.</div>
  </main>

  <section class="alarm-panel" id="alarmPanel">
    <div class="alarm-head">
      <label class="alarm-check"><input type="checkbox" id="alarmOn"> Alarm kur</label>
      <span class="alarm-for" id="alarmFor">Alarm için tablodan bir not seçin</span>
    </div>
    <div class="alarm-fields">
      <div class="af"><span>Başlangıç</span><input type="date" id="aStartDate"><button type="button" class="timebtn" id="aStartTime" data-empty="1">--:--</button></div>
      <div class="af"><span>Bitiş</span><input type="date" id="aEndDate"><button type="button" class="timebtn" id="aEndTime" data-empty="1">--:--</button></div>
      <div class="af"><span>Hatırlatma</span>
        <select id="aPeriod">
          <option value="0">Tekrar yok</option>
          <option value="5">5 dakika</option>
          <option value="10">10 dakika</option>
          <option value="15">15 dakika</option>
          <option value="30">30 dakika</option>
          <option value="60">1 saat</option>
          <option value="120">2 saat</option>
          <option value="180">3 saat</option>
          <option value="240">4 saat</option>
          <option value="300">5 saat</option>
          <option value="360">6 saat</option>
          <option value="480">8 saat</option>
          <option value="720">12 saat</option>
          <option value="1440">1 gün</option>
          <option value="2880">2 gün</option>
          <option value="4320">3 gün</option>
          <option value="5760">4 gün</option>
          <option value="7200">5 gün</option>
          <option value="8640">6 gün</option>
          <option value="10080">1 hafta</option>
          <option value="20160">2 hafta</option>
          <option value="1M">1 ay</option>
        </select>
        <span class="a-next" id="aNext"></span>
      </div>
    </div>
  </section>
  <a class="apk-link" id="apkLink" href="apk/">Android uygulamasını indir (APK)</a>
</div>

<!-- Arşiv ekranı -->
<div class="screen" id="archiveView" hidden>
  <div class="app">
    <header class="topbar">
      <div class="search" id="arSearchBox">
        <div class="chips" id="arChips"></div>
        <input id="arSearchInput" type="search" autocomplete="off" placeholder="Arşivde ara..." enterkeyhint="search">
        <button type="button" class="x-black x-clear" id="arClear" title="Aramayı temizle" aria-label="Aramayı temizle">&times;</button>
      </div>
      <button type="button" class="btn danger" id="arDelFiltered">Sil</button>
      <button type="button" class="btn" id="arClose">Kapat</button>
    </header>
    <div class="screen-title">Arşiv <span id="arCount"></span></div>
    <main class="table-wrap">
      <table class="notes">
        <thead>
          <tr><th class="c-aperson">Kişi</th><th class="c-adate">Alarm Zamanı</th><th class="c-notes">Notlar</th></tr>
        </thead>
        <tbody id="arBody"></tbody>
      </table>
      <div class="empty" id="arEmpty"></div>
    </main>
  </div>
</div>

<!-- Satır menüsü (basılı tutunca) -->
<div class="ctx-menu" id="rowMenu" hidden>
  <button type="button" id="rowMenuDel">Kaydı Sil</button>
</div>

<!-- Not ekle / düzenle -->
<div class="modal" id="noteModal" hidden>
  <div class="dialog note-dialog" role="dialog" aria-modal="true">
    <h2 id="noteTitle">Not Ekle</h2>
    <div class="row">
      <label class="fld grow"><span>Tarih</span><input type="date" id="fDate"></label>
      <label class="fld"><span>Saat</span><button type="button" class="timebtn" id="fTime">--:--</button></label>
    </div>
    <div class="row">
      <label class="fld grow"><span>Kişi Adı Soyadı</span><input type="text" id="fName" autocomplete="off"></label>
      <label class="fld"><span>Telefon</span><input type="tel" id="fPhone" autocomplete="off"></label>
    </div>
    <div class="row">
      <label class="fld grow"><span>Diğer Kişi Adı Soyadı</span><input type="text" id="fName2" autocomplete="off"></label>
      <label class="fld"><span>Diğer Kişi Telefonu</span><input type="tel" id="fPhone2" autocomplete="off"></label>
    </div>
    <label class="fld"><span>Notlar</span><textarea id="fNotes" rows="5"></textarea></label>
    <div class="actions">
      <button type="button" class="btn primary" id="saveBtn">Kaydet</button>
      <button type="button" class="btn" id="cancelBtn">Vazgeç</button>
    </div>
  </div>
</div>

<!-- Saat seçici -->
<div class="modal" id="clockModal" hidden>
  <div class="dialog clock-dialog" role="dialog" aria-modal="true">
    <div class="clock-head">
      <button type="button" id="ckH" class="on">00</button><span>:</span><button type="button" id="ckM">00</button>
    </div>
    <svg id="clockFace" viewBox="0 0 260 260" width="260" height="260"></svg>
    <div class="actions">
      <button type="button" class="btn primary" id="ckOk">Tamam</button>
      <button type="button" class="btn" id="ckCancel">İptal</button>
    </div>
  </div>
</div>

<!-- Onay -->
<div class="modal" id="confirmModal" hidden>
  <div class="dialog confirm-dialog" role="alertdialog" aria-modal="true">
    <div class="confirm-text" id="confirmText"></div>
    <div class="actions">
      <button type="button" class="btn danger" id="confirmYes">Evet</button>
      <button type="button" class="btn" id="confirmNo">Hayır</button>
    </div>
  </div>
</div>

<!-- Arşiv kaydı (salt okunur) -->
<div class="modal" id="arViewModal" hidden>
  <div class="dialog note-dialog" role="dialog" aria-modal="true">
    <h2>Arşiv Kaydı</h2>
    <div class="row">
      <div class="fld grow"><span>İlgili Kişi</span><div class="ro" id="avPerson"></div></div>
      <div class="fld"><span>Alarm Tarihi / Saati</span><div class="ro" id="avDate"></div></div>
    </div>
    <div class="fld"><span>Notlar</span><div class="ro ro-notes" id="avNotes"></div></div>
    <div class="actions">
      <button type="button" class="btn primary" id="avClose">Kapat</button>
    </div>
  </div>
</div>

<!-- Alarm uyarısı -->
<div class="modal" id="alarmModal" hidden>
  <div class="dialog alarm-dialog" role="alertdialog" aria-modal="true">
    <h2 id="alarmTitle"></h2>
    <div id="alarmText"></div>
    <div class="actions alarm-actions">
      <button type="button" class="btn danger" id="alarmDelNote">Notu Sil</button>
      <button type="button" class="btn warn" id="alarmDelAlarm">Alarmı Sil</button>
      <button type="button" class="btn primary" id="alarmOk">Devam</button>
    </div>
  </div>
</div>

<script src="native.js"></script>
<script src="app.js"></script>
</body>
</html>
